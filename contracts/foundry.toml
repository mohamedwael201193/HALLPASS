[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.24'
optimizer = true
optimizer_runs = 200
# Deploy script (script/DeployHallpass.s.sol) records the deployment in
# deployments/arc-5042.json via vm.writeFile — allow it (C4, deploy scripts).
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arc = 'https://rpc.mainnet.arc.io'

[etherscan]
arc = { key = '${ETHERSCAN_API_KEY}', chain_id = 5042, url = 'https://api.sourcify.dev/server' }

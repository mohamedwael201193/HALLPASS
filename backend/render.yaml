# Render Blueprint — HALLPASS API (Arc mainnet, chain 5042)
# One FREE web service. No paid plan, no disk, no background worker.
#
# Free-tier limits this blueprint accepts:
#   - Web services only. A worker (the indexer, the reputation watcher)
#     is not free, so it is not declared here.
#   - No persistent disk. SQLite lives at /tmp/hallpass.db and is wiped
#     when the free instance sleeps or restarts. Session and policy reads
#     come from Arc RPC, so that wipe does not invent or hide chain state.
#     The activity feed is the indexer cache; with no indexer it stays an
#     honest empty result.
#   - The process must listen on 0.0.0.0 and on the PORT Render injects.
#
# No secrets in this file. The read API does not sign transactions.
# RELAYER_PRIVATE_KEY is not set here: the relay is not this service.

services:
  - type: web
    name: hallpass-api
    runtime: node
    plan: free
    rootDir: backend/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RPC_URL
        value: https://rpc.mainnet.arc.io
      - key: CHAIN_ID
        value: "5042"
      - key: PLUGIN_ADDRESS
        value: "0x5543fb530763ce21Eb827446b4913B8DB7f0D3d9"
      - key: ENTRYPOINT_ADDRESS
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - key: DB_PATH
        value: /tmp/hallpass.db

# Render Blueprint — HALLPASS backend (Arc mainnet, chain 5042)
# One web service for the API, one background worker for the event indexer.
# No secrets in this file: every sensitive value uses `sync: false` and is
# set in the Render dashboard (or via RENDER_API_KEY tooling), never here.
#
# Prereqs before first deploy:
#   1. backend/api/package.json exists with "start": "node server.js"
#      (npm start runs in backend/api per repo convention)
#   2. backend/indexer/index.js exists (event indexer entrypoint)
#   3. Set all `sync: false` vars in the Render dashboard for BOTH services.

services:
  # --- API (web) -----------------------------------------------------------
  - type: web
    name: hallpass-api
    runtime: node
    plan: starter
    rootDir: backend/api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: hallpass-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        sync: false # Render injects PORT automatically; set only to override
      - key: RPC_URL
        sync: false # Arc mainnet RPC, e.g. https://rpc.mainnet.arc.io (public value)
      - key: PLUGIN_ADDRESS
        sync: false # HallpassPlugin deployment on Arc 5042 (public value)
      - key: ENTRYPOINT_ADDRESS
        sync: false # ERC-4337 v0.7 EntryPoint on Arc 5042 (public value)
      - key: DB_PATH
        value: /var/data/hallpass.db # sqlite file on the attached disk
      - key: FRONTEND_URL
        sync: false # Dashboard origin for CORS (public value)
      - key: RELAYER_PRIVATE_KEY
        sync: false # SECRET: relay service key for EntryPoint.handleOps

  # --- Indexer (background worker) -----------------------------------------
  # NOTE: the worker keeps its own sqlite db on its own disk. If the API's
  # activity feed must read what the indexer writes, promote both to a
  # shared database (set DB_PATH -> a shared store, or add DATABASE_URL)
  # instead of relying on two separate files.
  - type: worker
    name: hallpass-indexer
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node indexer/index.js
    disk:
      name: hallpass-indexer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RPC_URL
        sync: false # same Arc RPC as the API (public value)
      - key: PLUGIN_ADDRESS
        sync: false # same HallpassPlugin address (public value)
      - key: DB_PATH
        value: /var/data/indexer.db # sqlite file on the attached disk
